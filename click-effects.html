<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Effects — Rayos + Ondas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      cursor: none;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    #cursor {
      position: fixed;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: transform 0.1s ease, background 0.1s ease;
      mix-blend-mode: difference;
      z-index: 9999;
    }

    .info {
      color: rgba(255, 255, 255, 0.25);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-align: center;
      user-select: none;
      z-index: 10;
      position: relative;
    }

    .info span {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  <div id="cursor"></div>

  <div class="info">
    Haz click en cualquier parte
    <span>Rayos + Ondas expansivas</span>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('cursor');

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    // Seguir cursor
    window.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });

    // ── Paleta de colores ──────────────────────────────────────────────
    const PALETTES = [
      ['#ff6b6b', '#ffd93d', '#ff9f43'],   // cálido
      ['#4ecdc4', '#45b7d1', '#96e6a1'],   // frío
      ['#a29bfe', '#fd79a8', '#fdcb6e'],   // pastel
      ['#00cec9', '#0984e3', '#6c5ce7'],   // azul/morado
    ];
    let paletteIdx = 0;

    function randomColor(palette) {
      return palette[Math.floor(Math.random() * palette.length)];
    }

    // ── Pool de partículas ─────────────────────────────────────────────
    const particles = [];

    // Rayo (línea que sale del centro)
    class Ray {
      constructor(x, y, angle, color) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.color = color;
        this.length = 0;
        this.maxLength = 60 + Math.random() * 80;
        this.speed = 6 + Math.random() * 6;
        this.width = 1 + Math.random() * 2;
        this.alpha = 1;
        this.done = false;
        this.growing = true;
      }

      update() {
        if (this.growing) {
          this.length += this.speed;
          if (this.length >= this.maxLength) this.growing = false;
        } else {
          this.alpha -= 0.04;
          if (this.alpha <= 0) this.done = true;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.width;
        ctx.lineCap = 'round';
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(
          this.x + Math.cos(this.angle) * this.length,
          this.y + Math.sin(this.angle) * this.length
        );
        ctx.stroke();
        ctx.restore();
      }
    }

    // Onda expansiva (círculo que se expande)
    class Ripple {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = 0;
        this.maxRadius = 120 + Math.random() * 80;
        this.speed = 3 + Math.random() * 2;
        this.alpha = 0.8;
        this.width = 2 + Math.random() * 2;
        this.done = false;
      }

      update() {
        this.radius += this.speed;
        this.alpha = 0.8 * (1 - this.radius / this.maxRadius);
        if (this.radius >= this.maxRadius) this.done = true;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.width;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // Chispa (punto pequeño que vuela)
    class Spark {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.radius = 1.5 + Math.random() * 2;
        this.gravity = 0.1;
        this.done = false;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.alpha -= 0.025;
        if (this.alpha <= 0) this.done = true;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ── Generar efecto al click ────────────────────────────────────────
    function spawnEffect(x, y) {
      const palette = PALETTES[paletteIdx % PALETTES.length];
      paletteIdx++;

      // Rayos: distribuidos uniformemente en círculo
      const numRays = 10 + Math.floor(Math.random() * 8);
      for (let i = 0; i < numRays; i++) {
        const angle = (i / numRays) * Math.PI * 2 + Math.random() * 0.3;
        particles.push(new Ray(x, y, angle, randomColor(palette)));
      }

      // Ondas: 2-3 círculos concéntricos con delay
      const numRipples = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < numRipples; i++) {
        setTimeout(() => {
          particles.push(new Ripple(x, y, randomColor(palette)));
        }, i * 80);
      }

      // Chispas
      const numSparks = 12 + Math.floor(Math.random() * 10);
      for (let i = 0; i < numSparks; i++) {
        particles.push(new Spark(x, y, randomColor(palette)));
      }
    }

    canvas.style.pointerEvents = 'none';
    window.addEventListener('click', e => {
      spawnEffect(e.clientX, e.clientY);
    });

    // Touch support
    window.addEventListener('touchstart', e => {
      e.preventDefault();
      for (const t of e.touches) spawnEffect(t.clientX, t.clientY);
    }, { passive: false });

    // ── Loop de animación ──────────────────────────────────────────────
    function loop() {
      ctx.clearRect(0, 0, W, H);

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].done) particles.splice(i, 1);
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
